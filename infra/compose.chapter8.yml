services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: hello-agents-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - hello_agents_qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.26-community
    container_name: hello-agents-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the root .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - hello_agents_neo4j_data:/data
      - hello_agents_neo4j_logs:/logs

volumes:
  hello_agents_qdrant_data:
  hello_agents_neo4j_data:
  hello_agents_neo4j_logs:
